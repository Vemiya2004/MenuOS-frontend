<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Restaurant Ordering</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="favicon1/restaurant_logo-favicon.png">
    <style>
        .swal2-popup { background: #111111 !important; color: #F5F0E8 !important; border: 1px solid rgba(201,168,76,0.3) !important; }
        .swal2-title { color: #F5F0E8 !important; }
        .swal2-confirm { background: #C9A84C !important; color: #000 !important; font-weight: 700 !important; }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="header-content">
        <div class="header-top">
            <button id="backBtn" class="back-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <h1 class="header-title">Your Order</h1>
            <div style="width:44px;"></div><!-- spacer -->
        </div>
    </div>
</header>

<!-- Empty Cart -->
<div id="emptyCart" class="empty-cart" style="display:none;">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <p class="empty-text">Your cart is empty</p>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:24px;">Add something delicious from the menu</p>
    <button id="browseMenuBtn" class="btn-secondary" style="max-width:240px;">Browse Menu</button>
</div>

<!-- Cart Items -->
<div id="cartItems" class="cart-items-container"></div>

<!-- Cart Footer -->
<div id="cartFooter" class="cart-footer" style="display:none;">
    <div class="cart-summary">
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotalAmount">LKR 0.00</span>
        </div>
        <div class="summary-row">
            <span>Tax (10%)</span>
            <span id="taxAmount">LKR 0.00</span>
        </div>
        <div class="summary-row total">
            <span>Total</span>
            <span id="totalAmount">LKR 0.00</span>
        </div>
    </div>
    <button id="checkoutBtn" class="btn-primary" style="max-width:640px; margin:0 auto; display:flex;">
        Proceed to Checkout
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:18px;height:18px;stroke-width:2;">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </button>
</div>

<script src="js/cart.js"></script>
</body>
</html>
