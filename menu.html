<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant Ordering</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon1/restaurant_logo-favicon.png">
    <style>
        /* ── Offer Banner Carousel ── */
        .banner-carousel {
            margin: 12px 16px 0;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            margin: 8px 16px 4px;
        }

        .banner-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .banner-slide {
            flex: 0 0 100%;
            position: relative;
            cursor: pointer;
            border-radius: 16px;
            overflow: hidden;
            height: 130px;
            background: linear-gradient(135deg, #2D7A7C, #1f5456);
        }

        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-slide-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 20px;
        }

        .banner-slide-title {
            color: white;
            font-size: 17px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .banner-slide-subtitle {
            color: rgba(255,255,255,0.88);
            font-size: 12px;
            font-weight: 500;
        }

        .banner-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .banner-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #d1d5db;
            transition: background 0.25s, width 0.25s;
            cursor: pointer;
        }

        .banner-dot.active {
            background: #2D7A7C;
            width: 18px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src ="public/images/header-bg.png" alt="Header Background" class="header-img">
            <div class="header-top">  
                <h1 class="header-title">Menu</h1>
                <button id="cartBtn" class="cart-button">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                   <span id="cartBadge" class="cart-badge">0</span>
                </button>

            </div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search menu...">
            </div>
        </div>
    </header>

    <!-- Categories -->
    <div class="categories-container">
        <div id="categoriesList" class="categories-list">
            <!-- Categories will be loaded here -->
        </div>
    </div>

    <!-- Offer Banners -->
    <div id="bannerCarousel" class="banner-carousel" style="display:none;">
        <div id="bannerTrack" class="banner-track"></div>
        <div id="bannerDots" class="banner-dots"></div>
    </div>

    <!-- Menu Items -->
    <div class="menu-container">
        <img src ="public/images/main-bg.png" alt="Menu Background" class="menu-bg">
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading menu...</p>
        </div>
        <div id="menuGrid" class="menu-grid">
            <!-- Menu items will be loaded here -->
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="modal-close">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg> 
            </button>
            
            <div id="modalImage" class="modal-image">
                <span class="modal-emoji">🍽️</span>
            </div>
            
            <h2 id="modalName" class="modal-name"></h2>
            <p id="modalDescription" class="modal-description"></p>
            
            <div class="modal-info">
                <span class="info-item">
                    <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span id="modalTime"></span>
                </span>
                <span class="info-item">
                    <svg class="icon-small star" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span id="modalRating"></span>
                </span>
            </div>
            
            <p id="modalPrice" class="modal-price"></p>
            
            <button id="addToCartBtn" class="btn-primary">Add to Cart</button>
        </div>
    </div>

    <!-- Waiter Call Button -->
    <script src="js/waiter_call.js"></script>

    <script src="js/menu.js"></script>
</body>
</html>
