<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant Ordering</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="favicon1/restaurant_logo-favicon.png">
    <style>
        /* Override SweetAlert2 for dark theme */
        .swal2-popup {
            background: #111111 !important;
            color: #F5F0E8 !important;
            border: 1px solid rgba(201,168,76,0.3) !important;
        }
        .swal2-title { color: #F5F0E8 !important; }
        .swal2-html-container { color: #8A8078 !important; }
        .swal2-confirm { background: #C9A84C !important; color: #000 !important; font-weight: 700 !important; }
        .swal2-toast { background: #181818 !important; color: #4CAF7A !important; border: 1px solid rgba(76,175,122,0.3) !important; }
    </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="header">
    <div class="header-content">
        <div class="header-top">
            <div style="display:flex; flex-direction:column;">
                <span style="font-size:10px; letter-spacing:2px; color:var(--text-muted); font-family:var(--font-body); text-transform:uppercase; margin-bottom:2px;">Good Evening</span>
                <h1 class="header-title" id="restaurantName">Menu</h1>
            </div>
            <button id="cartBtn" class="cart-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span id="cartBadge" class="cart-badge" style="display:none;">0</span>
            </button>
        </div>

        <!-- Search -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search dishes...">
        </div>
    </div>
</header>

<!-- ═══ CATEGORIES ═══ -->
<div class="categories-container">
    <div id="categoriesList" class="categories-list">
        <button class="category-btn active">All</button>
    </div>
</div>

<!-- ═══ OFFER BANNERS ═══ -->
<div id="bannerCarousel" class="banner-carousel" style="display:none;">
    <div id="bannerTrack" class="banner-track"></div>
    <div id="bannerDots" class="banner-dots"></div>
</div>

<!-- ═══ MENU ═══ -->
<div class="menu-container">
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner"></div>
        <p style="color:var(--text-muted); font-size:14px; letter-spacing:1px;">Loading menu...</p>
    </div>
    <div id="menuGrid" class="menu-grid" style="display:none;"></div>
</div>

<!-- ═══ ITEM MODAL ═══ -->
<div id="itemModal" class="modal">
    <div class="modal-content">
        <button id="closeModal" class="modal-close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <div id="modalImage" class="modal-image">
            <span class="modal-emoji">🍽️</span>
        </div>

        <h2 id="modalName" class="modal-name"></h2>
        <p id="modalDescription" class="modal-description"></p>

        <div class="modal-info">
            <span class="info-item">
                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span id="modalTime"></span>
            </span>
            <span class="info-item">
                <svg class="icon-small star" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                <span id="modalRating"></span>
            </span>
        </div>

        <div id="modalPrice" class="modal-price"></div>

        <button id="addToCartBtn" class="btn-primary modal-add-btn">Add to Cart</button>
    </div>
</div>

<!-- Waiter Call -->
<script src="js/waiter_call.js"></script>
<script src="js/menu.js"></script>

<script>
// ── Override renderMenuItems to use luxury list style ──────────────────
const _origRender = window.renderMenuItems;
window.renderMenuItems = function() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = menuItems.filter(item =>
        item.name.toLowerCase().includes(search) ||
        (item.description && item.description.toLowerCase().includes(search))
    );

    const grid = document.getElementById('menuGrid');
    if (!grid) return;

    if (filtered.length === 0) {
        grid.innerHTML = '<p style="text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-display);font-style:italic;">No dishes found</p>';
        return;
    }

    const imgBase = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'https://menuos-backend.onrender.com';
    const placeholder = imgBase + '/uploads/placeholder.jpg';

    grid.innerHTML = filtered.map(item => {
        const imgUrl = (item.image_url && item.image_url.startsWith('http'))
            ? item.image_url
            : (item.image_url ? `${imgBase}/uploads/food_category/${(item.category||'general').toLowerCase()}/${item.image_url.split('/').pop()}` : placeholder);

        let priceText = '';
        if (item.has_sizes && item.sizes && item.sizes.length > 0) {
            const prices = item.sizes.map(s => Number(s.price));
            const min = Math.min(...prices), max = Math.max(...prices);
            priceText = min === max ? `LKR ${min}` : `LKR ${min} – ${max}`;
        } else {
            priceText = `LKR ${item.price || 0}`;
        }

        const oldPriceHtml = item.has_offer && !item.has_sizes
            ? `<span style="text-decoration:line-through;color:var(--text-muted);font-size:13px;margin-right:6px;">LKR ${item.original_price || item.price}</span>`
            : '';

        const offerBadge = item.has_offer
            ? `<div style="position:absolute;top:0;left:0;background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:2px 7px;border-radius:0 0 6px 0;letter-spacing:0.5px;">${item.discount_percent}% OFF</div>`
            : '';

        const sizeNote = item.has_sizes
            ? `<span style="font-size:11px;color:var(--text-muted);">Multiple sizes</span>` : '';

        return `
        <div class="menu-item" data-id="${item.id}">
            <div class="menu-item-image" style="position:relative;">
                ${offerBadge}
                <img src="${imgUrl}" alt="${item.name}" loading="lazy"
                     onerror="this.onerror=null;this.src='${placeholder}'">
            </div>
            <div class="menu-item-content">
                <div class="menu-item-name">${item.name}</div>
                ${item.description ? `<div class="menu-item-desc">${item.description}</div>` : ''}
                <div class="menu-item-info">
                    <span class="info-item">⏱ ${item.prep_time} min</span>
                    <span class="info-item">
                        <svg class="icon-small star" viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px;">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        ${item.rating}
                    </span>
                    ${sizeNote}
                </div>
                <div class="menu-item-price">${oldPriceHtml}${priceText}</div>
            </div>
            <div class="menu-item-add" data-id="${item.id}">+</div>
        </div>`;
    }).join('');

    // Attach click events
    document.querySelectorAll('.menu-item').forEach(el => {
        el.addEventListener('click', () => showItemModal(parseInt(el.dataset.id)));
    });
    document.querySelectorAll('.menu-item-add').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            showItemModal(parseInt(el.dataset.id));
        });
    });
};

// ── Style the add-to-cart button inside the modal ───────────────────────
document.addEventListener('DOMContentLoaded', () => {
    const addBtn = document.getElementById('addToCartBtn');
    if (addBtn) addBtn.className = 'btn-primary modal-add-btn';
});

// ── Update cart badge visibility ────────────────────────────────────────
const _origBadge = window.updateCartBadge;
window.updateCartBadge = function() {
    const badge = document.getElementById('cartBadge');
    const total = (window.cart || []).reduce((s,i) => s + i.quantity, 0);
    if (badge) {
        badge.textContent = total;
        badge.style.display = total > 0 ? 'flex' : 'none';
    }
};
</script>
</body>
</html>
