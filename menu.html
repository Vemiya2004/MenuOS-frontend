<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Restaurant Ordering</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="favicon1/restaurant_logo-favicon.png">
    <style>
        /* ── SweetAlert dark overrides ── */
        .swal2-popup { background: #111111 !important; color: #F5F0E8 !important; border: 1px solid rgba(201,168,76,0.3) !important; }
        .swal2-title { color: #F5F0E8 !important; }
        .swal2-html-container { color: #8A8078 !important; }
        .swal2-confirm { background: #C9A84C !important; color: #000 !important; font-weight: 700 !important; }
        .swal2-toast { background: #181818 !important; color: #4CAF7A !important; border: 1px solid rgba(76,175,122,0.3) !important; }

        /* ── LIGHT THEME overrides ── */
        [data-theme="light"] {
            --bg:          #F7F3EC;
            --bg-card:     #FFFFFF;
            --bg-elevated: #F0EBE0;
            --bg-glass:    rgba(247,243,236,0.94);
            --text:        #1A1612;
            --text-sub:    #5C5046;
            --text-muted:  #9E8F80;
            --border:      rgba(0,0,0,0.08);
            --border-gold: rgba(139,100,20,0.35);
            --gold:        #8B6414;
            --gold-light:  #B08020;
            --gold-dim:    rgba(139,100,20,0.10);
        }
        [data-theme="light"] .swal2-popup { background: #fff !important; color: #1A1612 !important; }
        [data-theme="light"] .swal2-title { color: #1A1612 !important; }

        /* ── TOP NAVBAR ── */
        .top-navbar {
            position: sticky; top: 0; z-index: 300;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-gold);
            padding: 0 18px;
            display: flex; align-items: center; justify-content: space-between;
            height: 52px;
        }
        .top-navbar-title {
            font-family: var(--font-display);
            font-size: 17px; font-weight: 700;
            color: var(--gold); letter-spacing: 2px;
            text-transform: uppercase; flex: 1; text-align: center;
        }
        .nav-actions {
            display: flex; align-items: center; gap: 6px;
        }
        .nav-icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--gold-dim);
            border: 1px solid var(--border-gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--gold);
            font-size: 13px; font-weight: 700;
            transition: all 0.2s;
            position: relative;
        }
        .nav-icon-btn:hover { background: var(--gold); color: #000; }
        .nav-icon-btn svg { width: 16px; height: 16px; }

        /* Cart badge in navbar */
        .nav-cart-badge {
            position: absolute; top: -5px; right: -5px;
            background: #E05252; color: #fff;
            font-size: 9px; font-weight: 800;
            width: 17px; height: 17px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
        }

        /* Currency dropdown */
        .currency-dropdown {
            position: absolute; top: 42px; right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px; padding: 6px;
            min-width: 130px; z-index: 999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
        }
        .currency-dropdown.open { display: block; }
        .currency-option {
            padding: 9px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            color: var(--text-sub); transition: all 0.15s;
            display: flex; align-items: center; gap: 8px;
        }
        .currency-option:hover { background: var(--gold-dim); color: var(--gold); }
        .currency-option.active { color: var(--gold); font-weight: 700; }

        /* Language dropdown */
        .lang-dropdown {
            position: absolute; top: 42px; right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px; padding: 6px;
            min-width: 150px; z-index: 999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
        }
        .lang-dropdown.open { display: block; }
        .lang-option {
            padding: 9px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            color: var(--text-sub); transition: all 0.15s;
            display: flex; align-items: center; gap: 8px;
        }
        .lang-option:hover { background: var(--gold-dim); color: var(--gold); }
        .lang-option.active { color: var(--gold); font-weight: 700; }

        /* ── CATEGORY SECTION (Golden Oak icon style) ── */
        .categories-section {
            background: var(--bg);
            padding: 16px 0 12px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto; white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .categories-section::-webkit-scrollbar { display: none; }
        .categories-inner {
            display: inline-flex; gap: 6px; padding: 0 16px;
        }
        .cat-icon-btn {
            display: inline-flex; flex-direction: column;
            align-items: center; gap: 5px;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1.5px solid var(--border);
            background: var(--bg-elevated);
            cursor: pointer; transition: all 0.2s;
            min-width: 72px;
        }
        .cat-icon-btn.active {
            background: var(--gold);
            border-color: var(--gold);
        }
        .cat-icon-btn .cat-emoji {
            font-size: 22px; line-height: 1;
        }
        .cat-icon-btn .cat-svg-icon {
            display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px;
            color: var(--text-sub);
            transition: color 0.2s;
        }
        .cat-icon-btn.active .cat-svg-icon { color: #000; }
        .cat-icon-btn:not(.active):hover .cat-svg-icon { color: var(--gold); }
        .cat-icon-btn .cat-label {
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
            color: var(--text-sub);
            font-family: var(--font-body);
        }
        .cat-icon-btn.active .cat-label { color: #000; }

        /* ── SEARCH + FILTER BAR ── */
        .search-filter-bar {
            padding: 12px 16px 0;
            background: var(--bg);
        }
        .search-wrap {
            position: relative; margin-bottom: 10px;
        }
        .search-wrap svg.s-icon {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            width: 15px; height: 15px; stroke: var(--text-muted);
        }
        .search-wrap input {
            width: 100%; padding: 11px 14px 11px 38px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text); font-size: 14px;
            font-family: var(--font-body); outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input::placeholder { color: var(--text-muted); }
        .search-wrap input:focus { border-color: var(--border-gold); }

        /* Veg/Non/All + Filter row */
        .filter-row {
            display: flex; align-items: center; gap: 7px;
            padding-bottom: 12px;
        }
        .diet-pill {
            padding: 6px 13px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            border: 1.5px solid var(--border);
            background: transparent; cursor: pointer;
            color: var(--text-sub); transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
            font-family: var(--font-body);
        }
        .diet-pill.active-all  { background: var(--gold); border-color: var(--gold); color: #000; }
        .diet-pill.active-veg  { background: #1a4a1a; border-color: #2e7d32; color: #4CAF7A; }
        .diet-pill.active-non  { background: #4a1a1a; border-color: #c62828; color: #E05252; }
        .diet-pill:hover:not(.active-all):not(.active-veg):not(.active-non) {
            border-color: var(--border-gold); color: var(--gold);
        }

        .filter-spacer { flex: 1; }

        .filter-icon-btn {
            width: 34px; height: 34px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: var(--bg-elevated);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-sub);
            transition: all 0.2s;
        }
        .filter-icon-btn:hover, .filter-icon-btn.active {
            border-color: var(--gold); color: var(--gold); background: var(--gold-dim);
        }
        .filter-icon-btn svg { width: 16px; height: 16px; }

        /* Price Filter Panel */
        .price-filter-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px; padding: 18px;
            margin: 0 0 12px; display: none;
        }
        .price-filter-panel.open { display: block; }
        .pf-title {
            font-size: 13px; font-weight: 700; color: var(--gold);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
        }
        .pf-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .pf-input-wrap { flex: 1; }
        .pf-input-wrap label {
            font-size: 10px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.8px;
            display: block; margin-bottom: 5px;
        }
        .pf-input-wrap input {
            width: 100%; padding: 9px 12px;
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 14px;
            font-family: var(--font-body); outline: none;
        }
        .pf-input-wrap input:focus { border-color: var(--border-gold); }
        .pf-actions { display: flex; gap: 8px; }
        .pf-apply { flex: 1; padding: 9px; background: var(--gold); color: #000;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            font-family: var(--font-body); font-size: 13px; }
        .pf-clear { padding: 9px 14px; background: var(--bg-elevated); color: var(--text-sub);
            border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
            font-family: var(--font-body); font-size: 13px; }

        /* ── MENU SECTIONS ── */
        .menu-section-header {
            padding: 22px 0 10px;
            border-bottom: 1px solid var(--border-gold);
            margin-bottom: 4px;
            display: flex; align-items: center; gap: 10px;
        }
        .menu-section-header .sec-emoji { font-size: 18px; }
        .menu-section-header .sec-name {
            font-family: var(--font-display);
            font-size: 14px; font-weight: 600;
            color: var(--gold); letter-spacing: 2px;
            text-transform: uppercase;
        }
        .menu-section-header .sec-count {
            margin-left: auto;
            font-size: 11px; color: var(--text-muted);
        }

        /* ── MENU ITEM ── */
        .menu-item {
            display: flex; align-items: center;
            gap: 14px; padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer; transition: background 0.15s;
            position: relative;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: rgba(201,168,76,0.04); margin: 0 -6px; padding-left: 6px; padding-right: 6px; }
        .menu-item:active { background: rgba(201,168,76,0.08); }

        .menu-item-image {
            flex-shrink: 0; width: 78px; height: 78px;
            border-radius: 12px; overflow: hidden;
            background: var(--bg-elevated); border: 1px solid var(--border);
            position: relative;
        }
        .menu-item-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .menu-item:hover .menu-item-image img { transform: scale(1.06); }

        .menu-item-badge {
            position: absolute; top: 4px; left: 4px;
            background: #ff0800; color: #000;
            font-size: 8px; font-weight: 800;
            padding: 2px 6px; border-radius: 4px; letter-spacing: 0.4px;
        }

        .menu-item-content { flex: 1; min-width: 0; }
        .menu-item-name {
            font-family: var(--font-display);
            font-size: 15px; font-weight: 600; color: var(--text);
            margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .menu-item-desc {
            font-size: 11px; color: var(--text-sub); line-height: 1.4; margin-bottom: 5px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .menu-item-meta {
            display: flex; align-items: center; gap: 10px;
            font-size: 10px; color: var(--text-muted); margin-bottom: 4px;
        }
        .meta-dot { color: var(--text-muted); }
        .menu-item-price { font-size: 16px; font-weight: 700; color: var(--gold); }
        .menu-item-oldprice { font-size: 12px; color: var(--text-muted); text-decoration: line-through; margin-right: 5px; }

        .menu-item-add {
            flex-shrink: 0; width: 32px; height: 32px;
            background: var(--gold-dim); border: 1.5px solid var(--border-gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--gold); cursor: pointer; font-size: 20px; line-height: 1;
            transition: all 0.2s;
        }
        .menu-item-add:hover { background: var(--gold); color: #000; transform: scale(1.1); }

        /* ── ITEM MODAL ── */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.82); z-index: 1000;
            align-items: flex-end; justify-content: center;
            backdrop-filter: blur(6px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border-radius: 24px 24px 0 0;
            border-top: 1px solid var(--border-gold);
            width: 100%; max-width: 640px;
            padding: 0 0 32px; position: relative;
            animation: slideUp 0.32s cubic-bezier(0.34,1.3,0.64,1);
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0.5; }
            to   { transform: translateY(0); opacity: 1; }
        }
        .modal-content::before {
            content: ''; display: block;
            width: 40px; height: 4px; background: var(--border);
            border-radius: 2px; margin: 14px auto 0;
        }
        .modal-close {
            position: absolute; top: 14px; right: 16px;
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-sub); transition: all 0.2s;
        }
        .modal-close:hover { color: var(--gold); border-color: var(--border-gold); }
        .modal-image {
            height: 220px; background: var(--bg-elevated);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; margin-top: 10px;
        }
        .modal-image img { width: 100%; height: 100%; object-fit: cover; }
        .modal-emoji { font-size: 64px; }
        .modal-name {
            font-family: var(--font-display); font-size: 24px; font-weight: 700;
            color: var(--text); padding: 18px 20px 5px; line-height: 1.2;
        }
        .modal-description { font-size: 13px; color: var(--text-sub); line-height: 1.6; padding: 0 20px 12px; }
        .modal-info {
            display: flex; gap: 18px; padding: 0 20px 12px;
            font-size: 13px; color: var(--text-sub); border-bottom: 1px solid var(--border);
        }
        .info-item { display: flex; align-items: center; gap: 4px; }
        .star { fill: var(--gold); }
        .modal-price {
            font-size: 26px; font-weight: 700; color: var(--gold);
            padding: 14px 20px 16px; font-family: var(--font-body);
        }
        .size-option {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 13px 16px; margin: 8px 20px;
            width: calc(100% - 40px);
            background: var(--bg-elevated);
            border: 1.5px solid var(--border); border-radius: 10px;
            cursor: pointer; color: var(--text); font-family: var(--font-body); font-size: 14px;
            transition: all 0.2s;
        }
        .size-option:hover { border-color: var(--border-gold); }

        .modal-add-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 4px 20px 0; width: calc(100% - 40px);
            padding: 15px 24px; background: var(--gold); color: #000;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
            font-family: var(--font-body); cursor: pointer; transition: all 0.2s;
        }
        .modal-add-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
        .modal-add-btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }

        /* ── BANNER ── */
        .banner-carousel {
            margin: 0; border-radius: 0;
            overflow: hidden; border-bottom: 1px solid var(--border-gold);
        }
        .banner-track { display: flex; transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); }
        .banner-slide {
            flex: 0 0 100%; height: 130px;
            background: linear-gradient(135deg, #1a1200, #0a0a0a);
            cursor: pointer; overflow: hidden; position: relative;
        }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }
        .banner-slide-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, transparent 65%);
            display: flex; flex-direction: column; justify-content: center; padding: 18px;
        }
        .banner-slide-title { color: var(--gold); font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 3px; }
        .banner-slide-subtitle { color: rgba(245,240,232,0.75); font-size: 12px; }
        .banner-dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0 2px; background: var(--bg); }
        .banner-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all 0.25s; }
        .banner-dot.active { background: var(--gold); width: 18px; border-radius: 3px; }

        /* ── LOADING ── */
        .loading-spinner { text-align: center; padding: 80px 20px; }
        .spinner {
            border: 2px solid var(--border); border-top: 2px solid var(--gold);
            border-radius: 50%; width: 36px; height: 36px;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── MENU CONTAINER ── */
        .menu-container { max-width: 640px; margin: 0 auto; padding: 0 16px 100px; }

        /* Translation badge */
        .translating-badge {
            display: none; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); border: 1px solid var(--border-gold);
            color: var(--gold); font-size: 12px; font-weight: 600;
            padding: 8px 18px; border-radius: 30px; z-index: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .translating-badge.show { display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
    </style>
</head>
<body>

<!-- ═══ TOP NAVBAR ═══ -->
<nav class="top-navbar">
    <!-- Left spacer (same width as nav-actions for centering) -->
    <div style="width:34px;"></div>

    <div class="top-navbar-title">MENU</div>

    <!-- Right controls -->
    <div class="nav-actions">

        <!-- Currency -->
        <div style="position:relative;">
            <div class="nav-icon-btn" id="currencyBtn" title="Currency" onclick="toggleDropdown('currencyDrop')">
                <span id="currencyLabel" style="font-size:11px;font-weight:800;letter-spacing:0.5px;">LKR</span>
            </div>
            <div class="currency-dropdown" id="currencyDrop">
                <div class="currency-option active" onclick="setCurrency('LKR','LKR')">🇱🇰 LKR</div>
                <div class="currency-option" onclick="setCurrency('USD','$')">🇺🇸 USD</div>
                <div class="currency-option" onclick="setCurrency('EUR','€')">🇪🇺 EUR</div>
                <div class="currency-option" onclick="setCurrency('GBP','£')">🇬🇧 GBP</div>
                <div class="currency-option" onclick="setCurrency('AUD','A$')">🇦🇺 AUD</div>
                <div class="currency-option" onclick="setCurrency('INR','₹')">🇮🇳 INR</div>
                <div class="currency-option" onclick="setCurrency('JPY','¥')">🇯🇵 JPY</div>
            </div>
        </div>

        <!-- Dark/Light toggle -->
        <div class="nav-icon-btn" id="themeBtn" title="Toggle Theme" onclick="toggleTheme()">
            <svg id="themeIconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="themeIconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </div>

        <!-- Language -->
        <div style="position:relative;">
            <div class="nav-icon-btn" id="langBtn" title="Language" onclick="toggleDropdown('langDrop')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            </div>
            <div class="lang-dropdown" id="langDrop">
                <div class="lang-option active" onclick="setLanguage('en','EN')">🇬🇧 English</div>
                <div class="lang-option" onclick="setLanguage('si','SI')">🇱🇰 සිංහල</div>
                <div class="lang-option" onclick="setLanguage('ta','TA')">🇮🇳 தமிழ்</div>

<script>
// ═══════════════════════════════════════════════════════
// VARIABLE BRIDGE — menu.js local vars → window scope
// menu.js uses local `categories`, `menuItems`, `selectedCategory`
// but our overrides read `window.categories` etc.
// We proxy them so both sides see the same data.
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
// CURRENCY SYSTEM
// ═══════════════════════════════════════════════════════
const EXCHANGE_RATES = {
    LKR: 1,
    USD: 0.00310,
    EUR: 0.00286,
    GBP: 0.00245,
    AUD: 0.00476,
    INR: 0.25789,
    JPY: 0.46200
};

let currentCurrency = 'LKR';
let currentSymbol   = 'LKR';
let currentDiet     = 'all';
let priceMinFilter  = null;
let priceMaxFilter  = null;
let currentLang     = 'en';
let translatedItems = {}; // cache: id → {name, description}

function convertPrice(lkrPrice) {
    const rate = EXCHANGE_RATES[currentCurrency] || 1;
    const converted = lkrPrice * rate;
    if (currentCurrency === 'LKR') return `${currentSymbol} ${Math.round(lkrPrice)}`;
    if (currentCurrency === 'JPY') return `${currentSymbol}${Math.round(converted)}`;
    return `${currentSymbol} ${converted.toFixed(2)}`;
}

function setCurrency(code, symbol) {
    currentCurrency = code;
    currentSymbol   = symbol;
    document.getElementById('currencyLabel').textContent = code;
    closeAllDropdowns();

    // Update active state
    document.querySelectorAll('.currency-option').forEach(o => {
        o.classList.toggle('active', o.textContent.includes(code));
    });

    renderMenuItems();
}

// ═══════════════════════════════════════════════════════
// THEME TOGGLE
// ═══════════════════════════════════════════════════════
function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeIconDark').style.display  = isDark ? 'none' : '';
    document.getElementById('themeIconLight').style.display = isDark ? ''     : 'none';
    localStorage.setItem('menu_theme', isDark ? 'light' : 'dark');
}

// Restore theme
(function() {
    const saved = localStorage.getItem('menu_theme');
    if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeIconDark').style.display  = 'none';
        document.getElementById('themeIconLight').style.display = '';
    }
})();

// ═══════════════════════════════════════════════════════
// LANGUAGE / TRANSLATION
// ═══════════════════════════════════════════════════════
const LANG_CODES = { en:'en', si:'si', ta:'ta', zh:'zh-CN', ja:'ja', fr:'fr', de:'de', ar:'ar', ko:'ko' };

async function setLanguage(code, label) {
    currentLang = code;
    closeAllDropdowns();
    document.querySelectorAll('.lang-option').forEach(o => {
        o.classList.toggle('active', o.textContent.includes(label));
    });

    if (code === 'en') {
        translatedItems = {};
        renderMenuItems();
        return;
    }

    const badge = document.getElementById('translatingBadge');
    badge.classList.add('show');

    try {
        // Translate visible item names + descriptions via MyMemory free API
        const toTranslate = window.menuItems || [];
        const cache = {};

        for (const item of toTranslate) {
            if (translatedItems[item.id]) continue; // already cached
            const [nameRes, descRes] = await Promise.all([
                translateText(item.name, code),
                item.description ? translateText(item.description, code) : Promise.resolve('')
            ]);
            cache[item.id] = { name: nameRes || item.name, description: descRes || item.description };
        }
        Object.assign(translatedItems, cache);
    } catch(e) {
        console.warn('Translation error:', e);
    }

    badge.classList.remove('show');
    renderMenuItems();
}

async function translateText(text, targetLang) {
    if (!text || targetLang === 'en') return text;
    try {
        const res = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`
        );
        const data = await res.json();
        return data?.responseData?.translatedText || text;
    } catch { return text; }
}

// ═══════════════════════════════════════════════════════
// DIET FILTER
// ═══════════════════════════════════════════════════════
function setDiet(type) {
    currentDiet = type;
    document.getElementById('dietAll').className = 'diet-pill' + (type==='all' ? ' active-all' : '');
    document.getElementById('dietVeg').className = 'diet-pill' + (type==='veg' ? ' active-veg' : '');
    document.getElementById('dietNon').className = 'diet-pill' + (type==='non' ? ' active-non' : '');
    renderMenuItems();
}

// ═══════════════════════════════════════════════════════
// PRICE FILTER
// ═══════════════════════════════════════════════════════
function togglePriceFilter() {
    const panel = document.getElementById('priceFilterPanel');
    const btn   = document.getElementById('priceFilterBtn');
    panel.classList.toggle('open');
    btn.classList.toggle('active');
}

function applyPriceFilter() {
    const minVal = document.getElementById('priceMin').value;
    const maxVal = document.getElementById('priceMax').value;
    priceMinFilter = minVal ? parseFloat(minVal) : null;
    priceMaxFilter = maxVal ? parseFloat(maxVal) : null;
    document.getElementById('priceFilterPanel').classList.remove('open');
    document.getElementById('priceFilterBtn').classList.toggle('active', priceMinFilter !== null || priceMaxFilter !== null);
    renderMenuItems();
}

function clearPriceFilter() {
    priceMinFilter = null; priceMaxFilter = null;
    document.getElementById('priceMin').value = '';
    document.getElementById('priceMax').value = '';
    document.getElementById('priceFilterPanel').classList.remove('open');
    document.getElementById('priceFilterBtn').classList.remove('active');
    renderMenuItems();
}

// ═══════════════════════════════════════════════════════
// DROPDOWN HELPERS
// ═══════════════════════════════════════════════════════
function toggleDropdown(id) {
    const isOpen = document.getElementById(id).classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) document.getElementById(id).classList.add('open');
}
function closeAllDropdowns() {
    document.querySelectorAll('.currency-dropdown, .lang-dropdown').forEach(d => d.classList.remove('open'));
}
document.addEventListener('click', e => {
    if (!e.target.closest('.nav-icon-btn') && !e.target.closest('.currency-dropdown') && !e.target.closest('.lang-dropdown')) {
        closeAllDropdowns();
    }
});

    'Drinks': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>`,
    'Burgers': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><path d="M5 12V8a7 7 0 0 1 14 0v4"/><path d="M3 16h18v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1z"/></svg>`,
    'Pizza': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9.5 16.5H2.5L12 2z"/><circle cx="12" cy="13" r="1"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>`,

function getCatIcon(name) {
    // Try exact match, then partial match
    if (CAT_SVG[name]) return CAT_SVG[name];
    const key = Object.keys(CAT_SVG).find(k => name.toLowerCase().includes(k.toLowerCase()));
    return CAT_SVG[key] || CAT_SVG['All'];
}

// ═══════════════════════════════════════════════════════
// OVERRIDE renderCategories → icon style
// ═══════════════════════════════════════════════════════
window.renderCategories = function() {
    const list = document.getElementById('categoriesList');
    if (!list) return;

    list.innerHTML = (window.categories || []).map(cat => `
        <div class="cat-icon-btn ${cat.name === (window.selectedCategory||'All') ? 'active' : ''}"
             data-category="${cat.name}" onclick="selectCategory('${cat.name}')">
            <span class="cat-svg-icon">${getCatIcon(cat.name)}</span>
            <span class="cat-label">${cat.name}</span>
        </div>
    `).join('');
};

async function selectCategory(name) {
    window.selectedCategory = name;
    window.showLoading && window.showLoading(true);
    await (window.loadMenu && window.loadMenu(name));
    window.renderCategories && window.renderCategories();
    renderMenuItems();
    window.showLoading && window.showLoading(false);
}

// ═══════════════════════════════════════════════════════
// OVERRIDE renderMenuItems → sections + filters + currency
// ═══════════════════════════════════════════════════════
window.renderMenuItems = function() {
    const grid   = document.getElementById('menuGrid');
    if (!grid) return;

    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    const allItems = window.menuItems || [];
    const imgBase  = window.API_BASE_URL || 'https://menuos-backend.onrender.com';
    const placeholder = imgBase + '/uploads/placeholder.jpg';

    // Apply filters
    let filtered = allItems.filter(item => {
        // Search
        const t = translatedItems[item.id];
        const nameMatch  = (t?.name || item.name).toLowerCase().includes(search);
        const descMatch  = (t?.description || item.description || '').toLowerCase().includes(search);
        if (search && !nameMatch && !descMatch) return false;

        // Diet (veg/non: we use item description keywords as proxy — no veg flag in API)
        // VEG keywords: egg, toast, pancake, omelette, waffle, salad, soup, veggie, vegetarian, cheese, mushroom, fruit, pasta, dessert, cake, ice cream, cappuccino, latte, coffee, tea, juice, smoothie
        if (currentDiet !== 'all') {
            const vegKeywords = ['egg','toast','pancake','waffle','omelette','salad','cheese','mushroom','fruit','veggie','vegetarian','pasta','cake','ice cream','coffee','cappuccino','latte','tea','juice','smoothie','bread','butter','cream','milk','pudding','cookie','brownie'];
            const itemText = (item.name + ' ' + (item.description||'')).toLowerCase();
            const isVeg = vegKeywords.some(k => itemText.includes(k));
            if (currentDiet === 'veg' && !isVeg) return false;
            if (currentDiet === 'non' && isVeg) return false;
        }

        // Price filter (in LKR base)
        const basePrice = item.price || 0;
        if (priceMinFilter !== null && basePrice < priceMinFilter) return false;
        if (priceMaxFilter !== null && basePrice > priceMaxFilter) return false;

        return true;
    });

    if (filtered.length === 0) {
        grid.innerHTML = `<p style="text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-display);font-style:italic;">No dishes found</p>`;
        return;
    }

    // Group by category if showing All or Banner, else flat list with one section
    const isBanner = (window.selectedCategory === 'Banner');
    const showingSingle = (window.selectedCategory && window.selectedCategory !== 'All' && !isBanner);
    let html = '';

    if (showingSingle) {
        html += renderSection(window.selectedCategory, filtered, imgBase, placeholder);
    } else {
        // Group by category (All view OR Banner filtered view)
        const grouped = {};
        filtered.forEach(item => {
            const cat = item.category || 'Other';
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(item);
        });
        Object.entries(grouped).forEach(([cat, items]) => {
            html += renderSection(cat, items, imgBase, placeholder);
        });
    }

    grid.innerHTML = html;

    document.querySelectorAll('.menu-item').forEach(el => {
        el.addEventListener('click', () => window.showItemModal && window.showItemModal(parseInt(el.dataset.id)));
    });
    document.querySelectorAll('.menu-item-add').forEach(el => {
        el.addEventListener('click', e => {
            e.stopPropagation();
            window.showItemModal && window.showItemModal(parseInt(el.dataset.id));
        });
    });
};

function renderSection(catName, items, imgBase, placeholder) {
    const emoji = getCatIcon(catName);
    let html = `
        <div class="menu-section-header">
            <span class="sec-emoji">${emoji}</span>
            <span class="sec-name">${catName}</span>
            <span class="sec-count">${items.length} item${items.length !== 1 ? 's' : ''}</span>
        </div>`;

    items.forEach(item => {
        const t = translatedItems[item.id];
        const displayName = t?.name || item.name;
        const displayDesc = t?.description || item.description || '';

        const imgUrl = (item.image_url && item.image_url.startsWith('http'))
            ? item.image_url
            : (item.image_url ? `${imgBase}/uploads/food_category/${(item.category||'general').toLowerCase()}/${item.image_url.split('/').pop()}` : placeholder);

        let priceHtml = '';
        if (item.has_sizes && item.sizes?.length > 0) {
            const prices = item.sizes.map(s => Number(s.price));
            const min = Math.min(...prices), max = Math.max(...prices);
            priceHtml = min === max ? convertPrice(min) : `${convertPrice(min)} – ${convertPrice(max)}`;
        } else {
            priceHtml = convertPrice(item.price || 0);
        }

        const oldPriceHtml = (item.has_offer && !item.has_sizes)
            ? `<span class="menu-item-oldprice">${convertPrice(item.original_price || item.price)}</span>`
            : '';

        const badge = item.has_offer
            ? `<div class="menu-item-badge">${item.discount_percent}% OFF</div>` : '';

        html += `
        <div class="menu-item" data-id="${item.id}">
            <div class="menu-item-image">
                ${badge}
                <img src="${imgUrl}" alt="${displayName}" loading="lazy"
                     onerror="this.onerror=null;this.src='${placeholder}'">
            </div>
            <div class="menu-item-content">
                <div class="menu-item-name">${displayName}</div>
                ${displayDesc ? `<div class="menu-item-desc">${displayDesc}</div>` : ''}
                <div class="menu-item-meta">
                    <span>⏱ ${item.prep_time} min</span>
                    <span class="meta-dot">·</span>
                    <span>⭐ ${item.rating}</span>
                    ${item.has_sizes ? `<span class="meta-dot">·</span><span>Multiple sizes</span>` : ''}
                </div>
                <div class="menu-item-price">${oldPriceHtml}${priceHtml}</div>
            </div>
            <div class="menu-item-add" data-id="${item.id}">+</div>
        </div>`;
    });

    return html;
}

// ═══════════════════════════════════════════════════════
// OVERRIDE showItemModal → use currency + translated name
// ═══════════════════════════════════════════════════════
const _origShowItemModal = window.showItemModal;
window.showItemModal = function(itemId) {
    const item = (window.menuItems || []).find(i => i.id === itemId);
    if (!item) return;

    window.selectedItem = item;
    window.selectedSize = null;

    const t = translatedItems[item.id];
    const displayName = t?.name || item.name;
    const displayDesc = t?.description || item.description || '';

    document.getElementById('modalName').textContent = displayName;
    document.getElementById('modalDescription').textContent = displayDesc;
    document.getElementById('modalTime').textContent = `${item.prep_time} min`;
    document.getElementById('modalRating').textContent = item.rating;

    const imgBase = window.API_BASE_URL || 'https://menuos-backend.onrender.com';
    const imgUrl  = (item.image_url && item.image_url.startsWith('http'))
        ? item.image_url
        : (item.image_url ? `${imgBase}/uploads/food_category/${(item.category||'general').toLowerCase()}/${item.image_url.split('/').pop()}` : imgBase+'/uploads/placeholder.jpg');

    document.getElementById('modalImage').innerHTML = `<img src="${imgUrl}" alt="${displayName}" onerror="this.onerror=null;this.src='${imgBase}/uploads/placeholder.jpg'">`;

    const addBtn   = document.getElementById('addToCartBtn');
    const priceDiv = document.getElementById('modalPrice');

    if (item.has_sizes && item.sizes?.length > 0) {
        priceDiv.innerHTML = `
            <p style="font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Select Size</p>
            ${item.sizes.map((size, i) => `
                <button class="size-option" data-idx="${i}">
                    <span style="font-weight:600;">${size.name}</span>
                    <span style="color:var(--gold);font-weight:700;">${convertPrice(size.price)}</span>
                </button>
            `).join('')}`;

        document.querySelectorAll('.size-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-option').forEach(b => {
                    b.style.background = 'var(--bg-elevated)';
                    b.style.borderColor = 'var(--border)';
                });
                btn.style.background   = 'var(--gold-dim)';
                btn.style.borderColor  = 'var(--gold)';
                window.selectedSize = item.sizes[parseInt(btn.dataset.idx)];
                addBtn.disabled = false;
                addBtn.style.opacity = '1';
            });
        });

        addBtn.disabled = true;
        addBtn.style.opacity = '0.5';
    } else {
        if (item.has_offer) {
            priceDiv.innerHTML = `
                <p style="font-size:14px;color:var(--text-muted);text-decoration:line-through;margin-bottom:4px;">${convertPrice(item.original_price || item.price)}</p>
                <p style="font-size:26px;font-weight:700;color:var(--gold);">${convertPrice(item.price)}</p>
                <p style="font-size:12px;color:#E05252;font-weight:700;">${item.discount_percent}% OFF</p>`;
        } else {
            priceDiv.innerHTML = `<p style="font-size:26px;font-weight:700;color:var(--gold);">${convertPrice(item.price || 0)}</p>`;
        }
        addBtn.disabled = false;
        addBtn.style.opacity = '1';
    }

    document.getElementById('itemModal').classList.add('active');
};

// ═══════════════════════════════════════════════════════
// CART BADGE UPDATE
// ═══════════════════════════════════════════════════════
window.updateCartBadge = function() {
    const badge = document.getElementById('cartBadge');
    if (!badge) return;
    const total = (window.cart || []).reduce((s, i) => s + i.quantity, 0);
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
};

// ═══════════════════════════════════════════════════════
// SHOW/HIDE LOADING  — force grid visible after render
// menu.js's local showLoading sets display:'grid' which is
// fine, but we also patch it here to ensure 'block' works.
// The key fix: after renderMenuItems runs, we force display.
// ═══════════════════════════════════════════════════════
window.showLoading = function(show) {
    const spinner = document.getElementById('loadingSpinner');
    const grid    = document.getElementById('menuGrid');
    if (!spinner || !grid) return;
    spinner.style.display = show ? 'block' : 'none';
    // Use 'block' not 'grid' — our sections layout is block-based
    grid.style.display    = show ? 'none'  : 'block';
};

// ── Patch: after menu.js loadData() completes, ensure grid is visible ──
// menu.js calls local showLoading(false) which sets display:'grid'.
// We use MutationObserver to catch when grid gets content and force block.
(function() {
    const grid = document.getElementById('menuGrid');
    if (!grid) return;
    const obs = new MutationObserver(() => {
        if (grid.innerHTML.trim() && grid.style.display !== 'block') {
            grid.style.display = 'block';
        }
    });
    obs.observe(grid, { childList: true });
})();

// ── Cart clear on token expiry ──────────────────────────
// menu.js's showSessionExpiredScreen is a LOCAL function —
// we can't override it. Instead, we patch validateToken's
// result by intercepting the fetch response from
// /api/validate-token. If invalid → clear all carts NOW.
const _origFetch = window.fetch;
window.fetch = async function(...args) {
    const result = await _origFetch.apply(this, args);
    // Only intercept validate-token responses
    if (typeof args[0] === 'string' && args[0].includes('validate-token')) {
        const clone = result.clone();
        clone.json().then(data => {
            if (data && data.valid === false) {
                // Token invalid → clear ALL cart keys immediately
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith('cart_table_')) keysToRemove.push(k);
                }
                keysToRemove.forEach(k => localStorage.removeItem(k));
                console.log('🧹 Cart cleared due to token expiry');
            }
        }).catch(() => {});
    }
    return result;
};

});
